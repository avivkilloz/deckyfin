<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Console/controller shape -->
  <rect x="5" y="30" width="90" height="45" rx="12" ry="12" fill="#1a1a2e" stroke="#e94560" stroke-width="3"/>
  <!-- D-pad -->
  <rect x="20" y="42" width="8" height="22" rx="2" fill="#e94560"/>
  <rect x="16" y="46" width="16" height="14" rx="2" fill="#e94560"/>
  <!-- Buttons A/B/X/Y -->
  <circle cx="72" cy="42" r="4" fill="#e94560"/>
  <circle cx="78" cy="48" r="4" fill="#e94560"/>
  <circle cx="72" cy="54" r="4" fill="#e94560"/>
  <circle cx="66" cy="48" r="4" fill="#e94560"/>
  <!-- Joysticks -->
  <circle cx="38" cy="48" r="8" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="38" cy="48" r="3" fill="#e94560"/>
  <circle cx="62" cy="48" r="8" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="62" cy="48" r="3" fill="#e94560"/>
  <!-- Start/Select -->
  <rect x="44" y="48" width="4" height="2" rx="1" fill="#e94560"/>
  <rect x="52" y="48" width="4" height="2" rx="1" fill="#e94560"/>
  <!-- Top shoulders -->
  <rect x="12" y="24" width="18" height="10" rx="4" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <rect x="70" y="24" width="18" height="10" rx="4" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <!-- Steam logo hint (center circle) -->
  <circle cx="50" cy="52" r="6" fill="none" stroke="#0f3460" stroke-width="1.5"/>
  <text x="50" y="56" text-anchor="middle" font-size="8" font-family="Arial" font-weight="bold" fill="#0f3460">S</text>
</svg>
